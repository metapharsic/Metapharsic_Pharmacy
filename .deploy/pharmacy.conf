# Virtual Host for Pharmacy on Port 80
server {
    listen 80;
    listen [::]:80;
    server_name pharmacy.metapharsic.cloud www.metpharsic-pharmacy.cloud metpharsic-pharmacy.cloud www.metapharsic-pharmacy.cloud metapharsic-pharmacy.cloud www.metpharsic-pharmacy.com metpharsic-pharmacy.com www.metapharsic-pharmacy.com metapharsic-pharmacy.com rx.metapharsic.cloud;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# Virtual Host for Pharmacy on Port 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pharmacy.metapharsic.cloud www.metpharsic-pharmacy.cloud metpharsic-pharmacy.cloud www.metapharsic-pharmacy.cloud metapharsic-pharmacy.cloud www.metpharsic-pharmacy.com metpharsic-pharmacy.com www.metapharsic-pharmacy.com metapharsic-pharmacy.com rx.metapharsic.cloud;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/metapharsic.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metapharsic.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# Instant HTTPS on Port 8443 for existing domain metapharsic.cloud (Zero DNS waiting required!)
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name metapharsic.cloud www.metapharsic.cloud _;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/metapharsic.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metapharsic.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
